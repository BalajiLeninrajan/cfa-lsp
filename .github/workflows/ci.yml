name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Upstream cforall commit the fork is based on (cfa-cc-1.0.0.397). The tests
  # need an installed CFA of this version for `cfa -E`, the prelude and the
  # libcfa headers, so CI builds one from upstream and caches it.
  CFA_COMMIT: fade1b551c966a956866b7fea0fa38b9e8ac4885
  CFA_PREFIX: /home/runner/cfa-cc

jobs:
  test:
    # Same OS as the cs343 student server, where CFA 1.0.0 is built with gcc-11.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq bison flex ccache gcc-11 g++-11

      - name: Restore CFA toolchain
        id: toolchain
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CFA_PREFIX }}
          key: cfa-toolchain-${{ env.CFA_COMMIT }}-gcc11-v1

      - name: Build CFA toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          git init -q "$RUNNER_TEMP/cfa-src"
          cd "$RUNNER_TEMP/cfa-src"
          git remote add origin https://github.com/cforall/cforall.git
          git fetch -q --depth 1 origin "$CFA_COMMIT"
          git checkout -q FETCH_HEAD
          # Checkout gives every file the same mtime; keep make from trying to
          # regenerate the tracked autotools, bison and flex output.
          touch aclocal.m4
          touch configure src/config.h.in Makefile.in */Makefile.in */*/Makefile.in tools/prettyprinter/Makefile.in
          touch src/AST/BasicKind.hpp src/Parser/lex.cc src/Parser/parser.cc src/Parser/parser.hh
          mkdir build && cd build
          ../configure --quiet --prefix="$CFA_PREFIX" --with-target-hosts=x86_64:debug \
            --disable-gprofiler CC=gcc-11 CXX=g++-11
          make -s -j"$(nproc)"
          make -s install
          # An installed toolchain doesn't have its build tree; the prelude's line
          # markers should point at files that don't exist, as they do for users.
          cd / && rm -rf "$RUNNER_TEMP/cfa-src"

      # Saved right away, so a failing build or test later doesn't throw it away.
      - name: Save CFA toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CFA_PREFIX }}
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      - name: Add cfa to PATH
        run: |
          echo "$CFA_PREFIX/bin" >> "$GITHUB_PATH"
          "$CFA_PREFIX/bin/cfa" --version 2>&1 | head -1 || true

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ hashFiles('.gitmodules') }}-${{ github.sha }}
          restore-keys: ccache-

      # Regenerates the bison and flex output, so a grammar change committed
      # without it fails here instead of building with the old parser.
      # Ubuntu's flex numbers the #line directives that point into lex.cc
      # itself one higher than the flex that wrote the committed file; they
      # only matter when debugging the generated code, so they're ignored.
      # The committed files are restored afterwards for the last step's check.
      - name: Check the parser matches the grammar
        run: |
          make parser
          git -C cforall diff --exit-code -I '^#line [0-9][0-9]* "Parser/lex\.cc"$' -- src/Parser
          git -C cforall checkout -- src/Parser

      # make must regenerate lex.cc after an edit to lex.ll, whether or not the
      # edit has been committed. The submodule is put back afterwards.
      - name: Check make regenerates the parser after a grammar edit
        run: |
          head=$(git -C cforall rev-parse HEAD)
          lex=cforall/src/Parser/lex.cc
          echo '// uncommitted grammar edit' >> cforall/src/Parser/lex.ll
          touch -d '1 minute ago' "$lex"
          make "$lex"
          grep -qF 'uncommitted grammar edit' "$lex"
          git -C cforall checkout -- src/Parser
          echo '// committed grammar edit' >> cforall/src/Parser/lex.ll
          git -C cforall -c user.name=ci -c user.email=ci@localhost commit -qm 'Edit the grammar' src/Parser/lex.ll
          touch -d '1 minute ago' "$lex"
          make "$lex"
          grep -qF 'committed grammar edit' "$lex"
          git -C cforall reset -q --hard "$head"

      # The build must not need bison or flex when the grammar output only
      # looks stale, as it can on a fresh clone. Backdating the output and
      # removing both tools checks that, configure included.
      - name: Build
        env:
          CXX: ccache g++
          CCACHE_DIR: /home/runner/.cache/ccache
          CCACHE_MAXSIZE: 2G
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: |
          sudo apt-get remove -yq bison flex
          if command -v bison || command -v flex; then echo 'bison or flex is still installed'; exit 1; fi
          touch -d '1 hour ago' cforall/src/Parser/parser.cc cforall/src/Parser/parser.hh cforall/src/Parser/lex.cc
          ccache -z
          make -j"$(nproc)" TRANSLATOR_JOBS="$(nproc)" server translator
          ccache -s

      - name: Test
        env:
          CXX: ccache g++
          CCACHE_DIR: /home/runner/.cache/ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: make -j"$(nproc)" test

      # clangd needs entries for the translator sources too. Check there is
      # one for each, and that the flags in one compile it.
      - name: Check compile_commands.json
        env:
          CCACHE_DIR: /home/runner/.cache/ccache
        run: |
          make compile_commands.json
          jq -e 'length > 0' compile_commands.json > /dev/null
          for f in $(git -C cforall ls-files 'src/*.cpp' 'src/**/*.cpp' | sed 's|^|cforall/|'); do
            jq -e --arg f "$PWD/$f" 'any(.[]; .file == $f)' compile_commands.json > /dev/null \
              || { echo "no entry for $f"; missing=1; }
          done
          [ -z "$missing" ]
          entry=$(jq -c --arg f "$PWD/cforall/src/LSP/Lsp.cpp" '.[] | select(.file == $f)' compile_commands.json)
          cd "$(jq -r .directory <<<"$entry")"
          eval "$(jq -r .command <<<"$entry") -fsyntax-only"

      # The installed layout (bin/cfa-lsp, libexec/cfa-lsp/cfa-cpp), stripped, as
      # a tarball because artifact zips drop the executable bit. The translator
      # is Cforall's code, so its BSD license goes along with it.
      - name: Package binaries
        env:
          CXX: ccache g++
          CCACHE_DIR: /home/runner/.cache/ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: |
          dist="$RUNNER_TEMP/cfa-lsp"
          make install PREFIX="$dist"
          install -Dm644 LICENSE "$dist/share/doc/cfa-lsp/LICENSE"
          install -Dm644 cforall/LICENSE "$dist/share/doc/cfa-lsp/LICENSE.cforall"
          tar -C "$dist" -czf "$RUNNER_TEMP/cfa-lsp-linux-x86_64.tar.gz" .

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: cfa-lsp-linux-x86_64
          path: ${{ runner.temp }}/cfa-lsp-linux-x86_64.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Save ccache
        if: always() && steps.ccache.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Check generated files are unchanged
        run: |
          git diff --exit-code
          git -C cforall diff --exit-code
